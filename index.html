<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Time Saving Tech Tips</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#e9ecef;
}

.header{
    background:#15803d;
    color:white;
    text-align:center;
    padding:25px 15px;
}

.header h1{
    margin:0;
    font-size:42px;
}

.header p{
    margin:6px 0;
    font-size:18px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:auto;
    display:block;
    cursor:pointer;
}

.tip-title{
    padding:12px;
    text-align:center;
    font-weight:bold;
    font-size:17px;
}

.viewer{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    z-index:999;
    overflow:auto;
    text-align:center;
}

.viewer img{
    width:90%;
    max-width:1400px;
    margin-top:30px;
    margin-bottom:30px;
    border-radius:10px;
    cursor:pointer;
}

.close{
    position:fixed;
    top:15px;
    right:25px;
    color:white;
    font-size:45px;
    cursor:pointer;
    z-index:1000;
}

.nav-btn{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,0.25);
    color:white;
    border:none;
    font-size:40px;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    z-index:1000;
}

.prev{
    left:15px;
}

.next{
    right:15px;
}

.footer{
    background:#15803d;
    color:white;
    text-align:center;
    padding:18px;
    margin-top:20px;
}

@media(max-width:768px){

    .header h1{
        font-size:28px;
    }

    .header p{
        font-size:15px;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .viewer img{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="header">

<h1>TIME SAVING TECH TIPS 💡</h1>

<p><b>By Hasan Chobarawala | Mob: 9926652153</b></p>

<p>Branch In-Charge | ICAI Ujjain Branch</p>

</div>

<div class="gallery" id="gallery"></div>

<div class="viewer" id="viewer">

<span class="close" onclick="closeViewer()">&times;</span>

<button class="nav-btn prev" onclick="prevImage()">❮</button>

<img id="viewerImg">

<button class="nav-btn next" onclick="nextImage()">❯</button>

</div>

<div class="footer">

WORK SMARTER, NOT HARDER!

</div>

<script>

const gallery=document.getElementById("gallery");

let currentImage=1;

for(let i=1;i<=120;i++){

    let card=document.createElement("div");

    card.className="card";

    card.innerHTML=`

    <img src="Tip ${i}.png" onerror="this.style.display='none'" onclick="openViewer(${i})">

    <div class="tip-title">
    TIME SAVING TECH TIP - ${i}
    </div>

    `;

    gallery.appendChild(card);
}

function openViewer(num){

    currentImage=num;

    document.getElementById("viewer").style.display="block";

    document.getElementById("viewerImg").src=`Tip ${num}.png`;
}

function closeViewer(){

    document.getElementById("viewer").style.display="none";
}

function nextImage(){

    if(currentImage<120){

        currentImage++;

        document.getElementById("viewerImg").src=`Tip ${currentImage}.png`;
    }
}

function prevImage(){

    if(currentImage>1){

        currentImage--;

        document.getElementById("viewerImg").src=`Tip ${currentImage}.png`;
    }
}

document.addEventListener("keydown",function(e){

    if(e.key==="ArrowRight") nextImage();

    if(e.key==="ArrowLeft") prevImage();

    if(e.key==="Escape") closeViewer();

});

</script>

</body>
</html>
