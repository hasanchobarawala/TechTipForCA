<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Time Saving Tech Tips</title>

<style>

body{
font-family:'Segoe UI';
margin:0;
background:#eef2f3;
}

/* HEADER */

.header{
background:#0f7c3a;
color:#fff;
padding:18px;
text-align:center;
}

.header h2{
margin:0;
font-size:36px;
}

.brand{
font-size:14px;
margin-top:5px;
}

/* SEARCH */

.search-box{
text-align:center;
padding:15px 10px 5px;
}

.search-box input{
padding:10px;
width:320px;
max-width:90%;
border-radius:8px;
border:1px solid #999;
font-size:15px;
}

/* FILTERS */

.filters{
text-align:center;
padding:10px;
}

.filters button{
margin:5px;
padding:8px 16px;
border:none;
border-radius:20px;
background:#d6d6d6;
cursor:pointer;
font-size:15px;
}

.filters button.active{
background:#16a34a;
color:white;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
gap:20px;
padding:20px;
}

/* CARD */

.card{
background:#fff;
padding:12px;
border-radius:14px;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:auto;
border-radius:10px;
cursor:pointer;
display:block;
}

/* TITLE */

.title{
font-size:16px;
margin-top:10px;
font-weight:bold;
text-align:center;
}

/* POPUP */

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.96);
justify-content:center;
align-items:center;
z-index:999;
overflow:auto;
}

/* POPUP IMAGE */

.popup-inner{
position:relative;
padding:40px;
}

#popupImg{
width:90vw;
max-width:1400px;
height:auto;
border-radius:12px;
transition:transform .2s;
cursor:grab;
}

/* NAVIGATION */

.nav{
position:fixed;
top:50%;
transform:translateY(-50%);
background:#16a34a;
color:#fff;
border:none;
padding:14px 18px;
font-size:26px;
border-radius:50%;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
z-index:1000;
}

.prev{
left:15px;
}

.next{
right:15px;
}

/* ZOOM BUTTONS */

.zoom{
position:fixed;
top:20px;
background:#2563eb;
color:#fff;
border:none;
padding:10px 14px;
font-size:22px;
border-radius:50%;
cursor:pointer;
z-index:1000;
}

.zin{
right:80px;
}

.zout{
right:20px;
}

/* CLOSE */

.close{
position:fixed;
top:18px;
left:20px;
background:red;
color:white;
border:none;
padding:10px 14px;
font-size:22px;
border-radius:50%;
cursor:pointer;
z-index:1000;
}

/* FOOTER */

.footer{
background:#0f7c3a;
color:white;
text-align:center;
padding:18px;
font-size:18px;
margin-top:10px;
}

/* MOBILE */

@media(max-width:768px){

.header h2{
font-size:26px;
}

.brand{
font-size:13px;
}

.grid{
grid-template-columns:1fr;
}

#popupImg{
width:98vw;
}

.nav{
font-size:20px;
padding:10px 14px;
}

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

<h2>TIME SAVING TECH TIPS 💡</h2>

<div class="brand">
By Hasan Chobarawala | Mob: 9926652153
</div>

<div class="brand">
Branch In-Charge | ICAI Ujjain Branch
</div>

</div>

<!-- SEARCH -->

<div class="search-box">

<input id="search" placeholder="Search tips...">

</div>

<!-- FILTERS -->

<div class="filters" id="filters"></div>

<!-- GRID -->

<div class="grid" id="grid"></div>

<!-- POPUP -->

<div class="popup" id="popup">

<button class="close" onclick="closePopup()">✖</button>

<button class="nav prev" onclick="prevTip(event)">⬅</button>

<button class="nav next" onclick="nextTip(event)">➡</button>

<button class="zoom zin" onclick="zoomIn(event)">＋</button>

<button class="zoom zout" onclick="zoomOut(event)">－</button>

<div class="popup-inner" id="inner">

<img id="popupImg">

</div>

</div>

<!-- FOOTER -->

<div class="footer">

WORK SMARTER, NOT HARDER!

</div>

<script>

/* ===== MANUAL DATA ===== */

let tips=[];

for(let i=1;i<=120;i++){

tips.push({
no:i,
title:"Time Saving Tech Tip",
cat:getCategory(i),
img:`Tip ${i}.png`
});

}

/* ===== AUTO CATEGORY ===== */

function getCategory(i){

if(i<=20) return "AI";
if(i<=40) return "Computer";
if(i<=60) return "Excel";
if(i<=80) return "Google";
if(i<=100) return "Google Sheets";

return "Utility";

}

/* ===== FILTER BUTTONS ===== */

function createFilters(){

const cats=["All",...new Set(tips.map(t=>t.cat))];

const fdiv=document.getElementById("filters");

fdiv.innerHTML="";

cats.forEach(c=>{

let b=document.createElement("button");

b.innerText=c;

b.onclick=(e)=>filter(c,e);

if(c==="All")b.classList.add("active");

fdiv.appendChild(b);

});

}

let currentCat="All";

let grid=document.getElementById("grid");

/* ===== LOAD ===== */

function load(){

grid.innerHTML="";

let s=document.getElementById("search").value.toLowerCase();

tips.forEach(t=>{

if((currentCat==="All"||t.cat===currentCat)&&
(("tip "+t.no).includes(s)||t.title.toLowerCase().includes(s))){

let d=document.createElement("div");

d.className="card";

d.innerHTML=`

<img src="${t.img}" onclick="openPopup(${t.no})">

<div class="title">

TIP ${t.no} - ${t.cat}

</div>

`;

grid.appendChild(d);

}

});

}

/* ===== FILTER ===== */

function filter(c,e){

currentCat=c;

document.querySelectorAll(".filters button")
.forEach(b=>b.classList.remove("active"));

e.target.classList.add("active");

load();

}

/* ===== SEARCH ===== */

document.getElementById("search")
.addEventListener("keyup",load);

/* ===== INIT ===== */

createFilters();

load();

/* ===== POPUP ===== */

let cur=1,zoom=1,x=0,y=0,drag=false,sx,sy;

function openPopup(n){

cur=n;

document.getElementById("popup").style.display="flex";

updateImg();

reset();

}

function closePopup(){

document.getElementById("popup").style.display="none";

}

function updateImg(){

document.getElementById("popupImg").src=`Tip ${cur}.png`;

}

/* ===== NEXT PREV ===== */

function nextTip(e){

e.stopPropagation();

cur++;

if(cur>tips.length)cur=1;

updateImg();

reset();

}

function prevTip(e){

e.stopPropagation();

cur--;

if(cur<1)cur=tips.length;

updateImg();

reset();

}

/* ===== ZOOM ===== */

function reset(){

zoom=1;

x=0;

y=0;

update();

}

function update(){

popupImg.style.transform=
`translate(${x}px,${y}px) scale(${zoom})`;

}

function zoomIn(e){

e.stopPropagation();

zoom+=0.2;

update();

}

function zoomOut(e){

e.stopPropagation();

zoom-=0.2;

if(zoom<1)zoom=1;

update();

}

/* ===== MOUSE WHEEL ===== */

popupImg.onwheel=e=>{

e.preventDefault();

zoom+=e.deltaY<0?0.1:-0.1;

if(zoom<1)zoom=1;

update();

};

/* ===== DRAG ===== */

inner.onmousedown=e=>{

drag=true;

sx=e.clientX-x;

sy=e.clientY-y;

};

document.onmousemove=e=>{

if(drag){

x=e.clientX-sx;

y=e.clientY-sy;

update();

}

};

document.onmouseup=()=>drag=false;

/* ===== KEYBOARD ===== */

document.addEventListener("keydown",function(e){

if(e.key==="ArrowRight") nextTip(e);

if(e.key==="ArrowLeft") prevTip(e);

if(e.key==="Escape") closePopup();

});

</script>

</body>
</html>
